name: PowerShell Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Cache PowerShell Modules (Linux/macOS)
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/.local/share/powershell/Modules
          key: ${{ runner.os }}-psmodules-${{ hashFiles('**/*.psm1') }}
          restore-keys: |
            ${{ runner.os }}-psmodules-

      - name: Cache PowerShell Modules (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ env.USERPROFILE }}\\Documents\\PowerShell\\Modules
          key: windows-psmodules-${{ hashFiles('**/*.psm1') }}
          restore-keys: |
            windows-psmodules-

      - name: Run Pester tests
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser
          if (-not (Get-Module -ListAvailable -Name Pester)) {
            Install-Module -Name Pester -Force -Scope CurrentUser -SkipPublisherCheck
          }
          Import-Module ./santricity/santricity.psd1 -Force
          Invoke-Pester -Script Tests -Passthru